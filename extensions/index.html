<!doctype html>
<html>
    <head>
		<meta charset="utf-8"/>
		<meta name="mobile-web-app-capable" content="yes"/>
		<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
		<link rel="stylesheet" href="//nadir320.github.io/extensions/SCAssistant/buttons.css"/>
		<link rel="shortcut icon" href="//nadir320.github.io/images/n.png" type="image/png"/>
		<title>nadir</title>
        <script>document.documentElement.classList.add(matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");</script>
        <style type="text/css">
            body {
                display: flex;
                background-color: whitesmoke;
                color: #222;
                flex-direction: column;
                gap: 1.5rem;
                padding: 1rem;
            }

            input {
                border: 1px solid silver;
                border-radius: 0.25rem;
                padding: 0.25rem;
            }

            .dark * {
                background-color: #222;
                color: whitesmoke;
            }

            a, a:active, a:visited {
                color: #222;
            }

            .dark a, .dark a:active, .dark a:visited {
                color: whitesmoke;
            }

            .loader {
                display: none;
                text-align: center;
            }

            .loader svg { width: 2rem; }

            .loading .loader { display: block; }

            .error {
                color: red;
                font-weight: bold;
            }

            #location {
                border-radius: 1rem;
                box-shadow: 0 0 1rem;
                margin: 0 auto;
                max-width: 80vw;
                padding: 1rem;
                width: 40rem;
            }

            #location #form {
                display: grid;
                gap: 0.25rem 0.5rem;
                grid-template-columns: auto 2fr auto;
            }

            #location #form label {
                grid-column: 1;
            }

            #location #form input {
                grid-column: 2 / span 2;
            }

            #location #form #list {
                grid-column-start: 3;
                padding: 0.5rem;
            }

            .results {
                border-radius: 1rem;
                box-shadow: 0 0 1rem;
                margin: 0 auto;
                max-width: 80vw;
                padding: 1rem;
                width: 40rem;
            }

            #files ol, #files ul {
                list-style-type: none;
            }

            #files li a {
                align-items: center;
                display: flex;
                gap: 0.25rem;
                width: fit-content;
            }

            #files li a ins::before {
                content: "";
                width: 2rem;
                height: 2rem;
                display: inline-block;
            }

            .dir::before {
                background-color: goldenrod;
                mask: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2024%2024%27%20width%3D%2724%27%20height%3D%2724%27%20fill%3D%27none%27%20stroke%3D%27black%27%20stroke-width%3D%271.5%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%3E%3Cpath%20d%3D%27M3%206.5h6l2%202h10v10.5a2%202%200%200%201-2%202H5a2%202%200%200%201-2-2z%27%2F%3E%3Cpath%20d%3D%27M3%2010.5h18%27%2F%3E%3C%2Fsvg%3E") center / contain no-repeat;
            }

            .file::before {
                background-color: dodgerBlue;
                mask: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%0D%0A%20%20%20%20%20viewBox%3D%220%200%2024%2024%22%0D%0A%20%20%20%20%20width%3D%2224%22%0D%0A%20%20%20%20%20height%3D%2224%22%0D%0A%20%20%20%20%20fill%3D%22none%22%0D%0A%20%20%20%20%20stroke%3D%22currentColor%22%0D%0A%20%20%20%20%20stroke-width%3D%221.5%22%0D%0A%20%20%20%20%20stroke-linecap%3D%22round%22%0D%0A%20%20%20%20%20stroke-linejoin%3D%22round%22%3E%0D%0A%0D%0A%20%20%20%20%3Cpath%20d%3D%22M6%202.5h8l5%205v13a1%201%200%200%201-1%201H6a2%202%200%200%201-2-2v-15a2%202%200%200%201%202-2z%22%2F%3E%0D%0A%0D%0A%20%20%20%20%3Cpath%20d%3D%22M14%202.5v5h5%22%2F%3E%0D%0A%0D%0A%20%20%20%20%3Cpath%20d%3D%22M8%2012h8%22%2F%3E%0D%0A%20%20%20%20%3Cpath%20d%3D%22M8%2015.5h8%22%2F%3E%0D%0A%20%20%20%20%3Cpath%20d%3D%22M8%2019h5%22%2F%3E%0D%0A%0D%0A%3C%2Fsvg%3E") center / contain no-repeat;
            }
        </style>
    </head>
    <body>
        <div id="location">
            <form id="form">
                <label for="user">User:</label><input id="user">
                <label for="repo">Repository:</label><input id="repo">
                <label for="path">Path:</label><input id="path">
                <ins></ins><input type="hidden" id="pat" disabled>
                <ins></ins><ins></ins><button type="submit" id="list">List</button>
            </form>
        </div>
        <div class="results">
            <h3 id="currentPath">No file found</h3>
            <div class="loader">
                <svg xmlns="http://w3.org" viewBox="0 0 100 100">
                    <defs>
                        <clipPath id="left-half">
                            <rect x="0" y="0" width="50" height="100" />
                        </clipPath>
                        <clipPath id="right-half">
                            <rect x="50" y="0" width="50" height="100" />
                        </clipPath>
                    </defs>

                    <style>
                    .page {
                        animation: infinite-flip 0.5s infinite linear;
                        transform-origin: 50px 50px;
                        transform-style: preserve-3d;
                    }

                    @keyframes infinite-flip {
                        0% { transform: rotateY(0deg); fill: #c0c0c0; }
                        50% { fill: #8a8a8a; }
                        100% { transform: rotateY(-180deg); fill: #b0b0b0; }
                    }
                    </style>

                    <circle cx="50" cy="50" r="40" fill="#b0b0b0" clip-path="url(#left-half)" />
                    <circle cx="50" cy="50" r="40" fill="#c0c0c0" clip-path="url(#right-half)" />
                    <circle class="page" cx="50" cy="50" r="40" clip-path="url(#right-half)" />
                </svg>
            </div>
            <div id="files"></div>
        </div>
        <script type="text/javascript">
            const user = document.getElementById("user"),
                repo = document.getElementById("repo"),
                path = document.getElementById("path"),
                pat = document.getElementById("pat");

            const p = new URLSearchParams(window.location.search);

            user.value = p.get("user");
            repo.value = p.get("repo");
            path.value = p.get("path");
            pat.value = p.get("pat");

            if (!user.value && !repo.value && !path.value && /\.github\.io$/i.test(window.location.hostname)) {
                const v = window.location.hostname.split(".");

                user.value = v[0];
                repo.value = window.location.hostname;
                path.value = window.location.pathname.replace(/^\/+|\/+$/g, "");
            }

            const list = async () => {
                if (user.value && repo.value) {
                    const url = new URL(`https://api.github.com/repos/${user.value}/${repo.value}/contents/${path.value}`);

                    const currentPath = document.getElementById("currentPath");

                    currentPath.innerHTML = `${repo.value}/${url.pathname.split("/").slice(5).join("/")}`;

                    const files = document.getElementById("files")

                    files.replaceChildren();
                    document.documentElement.classList.add("loading");
                    try {
                        const options = {};

                        if (pat.value) {
                            options.headers = {
                                /*"Accept": "application/vnd.github+json",*/
                                "Authorization": `Bearer ${pat.value}`/*,
                                "X-GitHub-Api-Version": "2026-03-10"*/
                            };
                        }

                        const response = await fetch(url, options);

                        const data = await response.json();

                        if (response.ok) {
                            currentPath.innerHTML += ` (${data.length})`;

                            let htmlString = "<ul>";

                            if (path.value) {
                                htmlString += `<li>
                                    <a href="?user=${user.value}&repo=${repo.value}&path=${path.value.split("/")
                                        .slice(0, -1).join("/")}&pat=${pat.value}">
                                        <ins class="dir"></ins>
                                        ..
                                    </a>
                                </li>`;
                            }

                            data.sort((a, b) => a.type.localeCompare(b.type));

                            for (let file of data) {
                                let url = file.type === "file" ?
                                    file.download_url :
                                    `?user=${user.value}&repo=${repo.value}&path=${file.path}&pat=${pat.value}`;

                                htmlString += `<li>
                                    <a href="${url}" ${file.type === "file" ? "target=\"_blank\"" : ""}>
                                        <ins class="${file.type}"></ins>
                                        <span>${file.name}</span>
                                    </a>
                                </li>`;
                            }

                            htmlString += "</ul>";
                            files.innerHTML = htmlString;
                        } else {
                            files.innerHTML = `<div class="error">${data.message}</div>`;
                        }
                    } catch (e) {
                        files.innerHTML = `<div class="error">${e.message}</div>`;
                    } finally {
                        document.documentElement.classList.remove("loading");
                    }
                }
            };

            document.getElementById("form").addEventListener("submit", e => {
                list();
                e.preventDefault();
            });
            list();
        </script>
    <body>
</html>
